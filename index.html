<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Snake</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        
        <!-- Screen 1: Main Menu -->
        <div id="mainMenu" class="screen active">
            <div class="top-bar">
                <div class="high-score">
                    HIGH SCORE<br>
                    <span id="highScoreText" class="score-yellow">0000</span>
                </div>
            </div>
            
            <div class="title-container">
                <h1 class="title-color">SNAKE</h1>
                <h1 class="title-snake">PRO</h1>
            </div>
            
            <button id="playBtn" class="play-btn">PLAY</button>
            
            <div class="bottom-icons">
                <button class="icon-btn-circle">⚙️</button>
                <button class="icon-btn-circle">🔊</button>
                <button class="icon-btn-circle">🎵</button>
            </div>
        </div>

        <!-- Screen 2: Level Selection -->
        <div id="levelMenu" class="screen">
            <h2 class="menu-title">SELECT LEVEL</h2>
            <div class="level-list">
                <button class="level-btn" data-level="1">LEVEL 1 - CLASSIC</button>
                <button class="level-btn" data-level="2">LEVEL 2 - BORDERS</button>
                <button class="level-btn" data-level="3">LEVEL 3 - MAZE</button>
            </div>
            <div class="action-buttons">
                <button id="homeBtn" class="action-btn">HOME</button>
                <button id="exitBtn" class="action-btn">EXIT</button>
            </div>
        </div>

        <!-- Screen 3: Game Screen -->
        <div id="gameScreen" class="screen">
            <header class="game-header">
                <div class="stats">
                    <div class="stat-box">SCORE: <span id="score" class="score-yellow">0</span></div>
                    <div class="stat-box">LEVEL: <span id="level" class="score-yellow">1</span></div>
                </div>
                <div class="header-actions">
                    <button id="pauseBtn" class="action-btn small">⏸️</button>
                    <button id="gameHomeBtn" class="action-btn small">HOME</button>
                </div>
            </header>

            <div class="canvas-container">
                <div class="canvas-wrapper">
                    <canvas id="gameCanvas" width="400" height="400"></canvas>
                    
                    <div id="gameOverOverlay" class="overlay">
                        <h2 class="menu-title">GAME OVER</h2>
                        <p>SCORE: <span id="finalScore" class="score-yellow">0</span></p>
                        <button id="restartBtn" class="play-btn small">AGAIN</button>
                        <button id="gameOverHomeBtn" class="action-btn mt-1">HOME</button>
                    </div>

                    <div id="pauseOverlay" class="overlay">
                        <h2 class="menu-title">PAUSED</h2>
                        <button id="resumeBtn" class="play-btn small">RESUME</button>
                        <button id="endGameBtn" class="action-btn mt-1">END GAME</button>
                    </div>
                </div>
            </div>

            <div class="mobile-controls">
                <div class="control-row">
                    <button class="dpad-btn" id="upBtn">▲</button>
                </div>
                <div class="control-row">
                    <button class="dpad-btn" id="leftBtn">◀</button>
                    <button class="dpad-btn" id="downBtn">▼</button>
                    <button class="dpad-btn" id="rightBtn">▶</button>
                </div>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
